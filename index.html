<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Entrenamiento</title>
<meta name="theme-color" content="#1a1f1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>Entrenamiento</h1>
    <span id="status-pill" class="pill">offline listo</span>
  </div>
</header>

<main class="wrap">

  <!-- ---------- Vista: lista de entrenamientos ---------- -->
  <section id="view-lista" class="view">

    <section class="card">
      <div class="card-head">
        <h2>Entrenamientos</h2>
        <div class="actions">
          <button id="btn-export" class="ghost">Exportar</button>
          <label class="ghost file-label">
            Importar
            <input type="file" id="input-import" accept="application/json" hidden>
          </label>
        </div>
      </div>

      <div id="form-nuevo-wrap" class="form-nuevo hidden">
        <label>
          Fecha del entrenamiento
          <input type="date" id="fecha-nuevo">
        </label>
        <div class="form-actions">
          <button id="btn-crear-entrenamiento">Crear entrenamiento</button>
          <button id="btn-cancelar-nuevo" class="ghost" type="button">Cancelar</button>
        </div>
      </div>

      <button id="btn-nuevo" class="btn-nuevo">+ Nuevo entrenamiento</button>
    </section>

    <ul id="lista-entrenamientos" class="lista-entrenamientos"></ul>
    <p id="vacio" class="vacio">Todavía no registraste ningún entrenamiento.</p>
  </section>

  <!-- ---------- Vista: detalle de un entrenamiento ---------- -->
  <section id="view-detalle" class="view hidden">
    <button id="btn-volver" class="ghost btn-volver">‹ Volver</button>

    <section class="card detalle-header">
      <h2 id="detalle-fecha"></h2>
      <button id="btn-borrar-entrenamiento" class="ghost danger">Borrar entrenamiento</button>
    </section>

    <div id="lista-ejercicios"></div>

    <section class="card">
      <h2>Agregar ejercicio</h2>
      <form id="form-ejercicio">
        <input type="text" id="nombre-ejercicio" placeholder="Ej: Press banca" required list="ejercicios-sugeridos" autocomplete="off">
        <datalist id="ejercicios-sugeridos"></datalist>
        <button type="submit">Agregar ejercicio</button>
      </form>
    </section>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
